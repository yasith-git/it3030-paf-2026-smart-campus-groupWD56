name: Smart Campus CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Create application-local.properties
        run: |
          mkdir -p backend/src/main/resources
          echo "spring.datasource.url=${{ secrets.DB_URL }}" > backend/src/main/resources/application-local.properties
          echo "spring.datasource.username=${{ secrets.DB_USERNAME }}" >> backend/src/main/resources/application-local.properties
          echo "spring.datasource.password=${{ secrets.DB_PASSWORD }}" >> backend/src/main/resources/application-local.properties
          echo "spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver" >> backend/src/main/resources/application-local.properties

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Build and test with Maven
        run: |
          cd backend
          ./mvnw clean test
          
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
